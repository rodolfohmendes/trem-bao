<script>
/**
 * app.js — front end do PoV Runner (página única, sem frameworks). Conversa com o servidor só por
 * google.script.run (via api()). As regras compartilhadas (rótulos, filtros do planejador, checklist,
 * sugestão de status, filtro de audiência) vêm de clientSharedCode(), injetado antes deste script.
 */
(function () {
  'use strict';

  // ============================================================ utilidades
  var $ = function (id) { return document.getElementById(id); };
  function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function has(arr, v) { return (arr || []).indexOf(v) >= 0; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  var fmt = fixedOffsetFormatter(-new Date().getTimezoneOffset());
  function dt(iso) { return fmt(iso, 'datetime'); }
  function todayIso() { return fmt(new Date().toISOString(), 'isodate'); }
  function rel(iso) {
    var t = new Date(iso).getTime();
    if (!iso || isNaN(t)) return '';
    var s = (Date.now() - t) / 1000;
    if (s < 60) return 'agora';
    if (s < 3600) return 'há ' + Math.floor(s / 60) + ' min';
    if (s < 43200) return 'há ' + Math.floor(s / 3600) + ' h';
    var full = dt(iso);
    return full.slice(0, 5) + ' ' + full.slice(11);
  }
  function debounce(fn, ms) {
    var t = null;
    return function () { var args = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, args); }, ms); };
  }
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* armazenamento bloqueado: segue sem lembrar */ } }
  function lines(text) { return String(text || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean); }
  function link(url, label, cls) {
    var u = safeUrl(url);
    if (!u) return esc(label || url || '');
    return '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer"' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(label || u) + '</a>';
  }
  var TIPO_DOC = { plano: 'Plano de testes', resultados: 'Relatório de resultados', status: 'Status da PoV' };
  var PUBLICO = { interno: 'Interno', cliente: 'Cliente' };
  var HIST_TIPO = { status: 'Status', pov: 'PoV', plano: 'Plano', escopo: 'Escopo', aceite: 'Aceite', criterio: 'Critério', pendencia: 'Pendência',
    versao: 'Versão do caso', relatorio: 'Documento' };
  var LEAK_TIPO = { concorrente: 'Concorrente', 'e-mail': 'E-mail', palavra: 'Palavra', link: 'Link' };
  var PROGRESS_ORDER = ['pass', 'partial', 'fail', 'blocked', 'in_progress', 'not_applicable'];

  // ------------------------------------------------------------ toast e chamadas ao servidor
  function toast(msg, isError) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = ''; }, isError ? 8000 : 3800);
  }
  function fail(e) { toast((e && e.message) || String(e), true); }
  var inflight = 0;
  function loading(delta) {
    inflight = Math.max(0, inflight + delta);
    $('loading').classList.toggle('on', inflight > 0);
  }
  /** google.script.run como promessa, com barra de carregamento. Erros viram Error(mensagem do servidor). */
  function api(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    loading(1);
    return new Promise(function (resolve, reject) {
      var settled = false;
      function done() { if (!settled) { settled = true; loading(-1); } }
      try {
        var runner = google.script.run
          .withSuccessHandler(function (r) { done(); resolve(r); })
          .withFailureHandler(function (e) { done(); reject(new Error(e && e.message ? e.message : String(e || 'Falha na chamada ao servidor.'))); });
        if (typeof runner[name] !== 'function') throw new Error('Função do servidor indisponível: ' + name + '. Recarregue a página.');
        runner[name].apply(runner, args);
      } catch (e) { done(); reject(e); }
    });
  }

  // ============================================================ estado
  var LS_CLIENT = 'povrunner.modoCliente';
  var state = {
    user: '', admin: false, visibilidade: 'equipe', libraryLoaded: false, importIncompleto: false, appVersion: '',
    catalog: null, view: 'boot', allPovs: [], povs: [], povFilter: { q: '', status: '', mine: false },
    povId: null, pov: null, d: null, tab: 'exec', tabByPov: {},
    exec: { status: '', mine: false, today: false, q: '', selected: {} },
    plan: { sel: {}, q: '', industry: '', lab: false, deprecated: false, hideIn: false, checked: {}, open: {} },
    rep: { tipo: 'resultados', publico: 'interno', detalhe: null, preview: null, key: '', seq: 0, lastSave: null },
    clientMode: lsGet(LS_CLIENT) === '1',
    adminInfo: null, imp: { ref: '', name: '', dry: null, error: '', allowPartial: false, confirmOrphans: false },
  };
  var cat = { flat: [], byId: {}, anc: {}, ucNodes: [] };

  function setCatalog(c) {
    state.catalog = c;
    cat = { flat: [], byId: {}, anc: {}, ucNodes: [] };
    if (!c) return;
    (function walk(nodes, parent, depth) {
      nodes.forEach(function (n) {
        n._depth = depth;
        n._parent = parent ? parent.node_id : null;
        cat.flat.push({ node_id: n.node_id, parent_id: n._parent });
        cat.byId[n.node_id] = n;
        walk(n.children || [], n, depth + 1);
      });
    })(c.tree, null, 0);
    Object.keys(cat.byId).forEach(function (id) {
      var chain = [], cur = id, guard = 0;
      while (cur && guard++ < 30) { chain.push(cur); cur = cat.byId[cur] ? cat.byId[cur]._parent : null; }
      cat.anc[id] = chain;
    });
    cat.ucNodes = cat.flat.map(function (f) { return cat.byId[f.node_id]; })
      .filter(function (n) { return n.type ? n.type === 'Use Case' : n._depth === 1; })
      .map(function (n) { return { id: n.node_id, label: nodePath(n.node_id) }; })
      .sort(function (a, b) { return foldText(a.label) < foldText(b.label) ? -1 : 1; });
    var small = cat.flat.length <= 80;
    state.plan.open = {};
    cat.flat.forEach(function (f) { var n = cat.byId[f.node_id]; if (n.children.length && (small || n._depth < 1)) state.plan.open[f.node_id] = true; });
  }
  function nodePath(id) { return (cat.anc[id] || []).slice().reverse().map(function (x) { return cat.byId[x] ? cat.byId[x].name : x; }).join(' › '); }

  // ============================================================ modais
  var modals = [];
  var modalSeq = 0;
  function focusFirst(root) {
    var el = root.querySelector('[data-autofocus]:not([disabled])') ||
      root.querySelector('.modal-body input:not([type=hidden]):not([type=checkbox]):not([type=file]):not([disabled]), .modal-body select:not([disabled]), .modal-body textarea:not([disabled])') ||
      root.querySelector('.actions button:not([disabled])');
    if (el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
  }
  /**
   * Abre um modal. o: {title (HTML já escapado), sub (HTML), body, footer (HTML), wide, cls, isDirty(), onClose()}.
   * Devolve {el, $, close, requestClose, busy}. Esc e clique fora chamam requestClose (que confirma se houver rascunho).
   */
  function openModal(o) {
    var bg = document.createElement('div');
    bg.className = 'modal-bg';
    var m = document.createElement('div');
    var tid = 'modal-t-' + (++modalSeq);
    m.className = 'modal' + (o.wide ? ' wide' : '') + (o.cls ? ' ' + o.cls : '');
    m.setAttribute('role', 'dialog');
    m.setAttribute('aria-modal', 'true');
    m.setAttribute('aria-labelledby', tid);
    if (o.id) m.id = o.id;
    m.innerHTML = '<div class="modal-head"><div class="mh-text"><h3 id="' + tid + '">' + o.title + '</h3>' + (o.sub ? '<div class="sub">' + o.sub + '</div>' : '') + '</div>' +
      '<button type="button" class="x ghost" aria-label="Fechar">×</button></div>' +
      '<div class="modal-body">' + (o.body || '') + '</div>' + (o.footer ? '<div class="actions">' + o.footer + '</div>' : '');
    bg.appendChild(m);
    $('modal-root').appendChild(bg);
    var prevFocus = document.activeElement;
    var h = { el: m, closed: false };
    h.$ = function (sel) { return m.querySelector(sel); };
    h.close = function () {
      if (h.closed) return;
      h.closed = true;
      bg.parentNode && bg.parentNode.removeChild(bg);
      var i = modals.indexOf(h);
      if (i >= 0) modals.splice(i, 1);
      document.body.classList.toggle('modal-open', modals.length > 0);
      if (o.onClose) o.onClose();
      if (prevFocus && prevFocus.focus && document.body.contains(prevFocus)) { try { prevFocus.focus(); } catch (e) { /* elemento sumiu */ } }
    };
    h.requestClose = function () {
      if (o.isDirty && o.isDirty()) {
        askConfirm('Descartar as alterações?', 'Há alterações não salvas nesta janela. Se fechar agora, elas se perdem.', { ok: 'Descartar', cancel: 'Continuar editando', danger: true })
          .then(function (ok) { if (ok) h.close(); });
      } else h.close();
    };
    h.busy = function (on) {
      qsa('.actions button', m).forEach(function (b) {
        if (on) { b.setAttribute('data-was', b.disabled ? '1' : ''); b.disabled = true; } else if (b.hasAttribute('data-was')) { b.disabled = b.getAttribute('data-was') === '1'; b.removeAttribute('data-was'); }
      });
    };
    m.querySelector('.x').addEventListener('click', function () { h.requestClose(); });
    bg.addEventListener('mousedown', function (e) { if (e.target === bg) h.requestClose(); });
    modals.push(h);
    document.body.classList.add('modal-open');
    setTimeout(function () { if (!h.closed) focusFirst(m); }, 0);
    return h;
  }
  function topModal() { return modals.length ? modals[modals.length - 1] : null; }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modals.length) { e.preventDefault(); topModal().requestClose(); }
  });

  /** Confirmação dentro da página. Resolve true/false. */
  function askConfirm(title, html, o) {
    o = o || {};
    return new Promise(function (resolve) {
      var done = false;
      var h = openModal({
        title: esc(title), body: '<div class="confirm-body">' + html + '</div>', cls: 'narrow' + (o.cls ? ' ' + o.cls : ''), id: o.id,
        footer: '<button type="button" class="ghost" data-act="no">' + esc(o.cancel || 'Cancelar') + '</button>' +
          '<button type="button" class="' + (o.danger ? 'danger-solid' : 'primary') + '" data-act="yes" data-autofocus>' + esc(o.ok || 'Confirmar') + '</button>',
        onClose: function () { if (!done) resolve(false); },
      });
      h.$('[data-act=no]').addEventListener('click', function () { h.close(); });
      h.$('[data-act=yes]').addEventListener('click', function () { done = true; h.close(); resolve(true); });
    });
  }
  /** Pede um texto (motivo, resolução…). Resolve o texto ou null. o: {sub, label, min, max, multiline, placeholder, ok, danger, value, minMsg}. */
  function askText(title, o) {
    o = o || {};
    return new Promise(function (resolve) {
      var done = false;
      var max = o.max || LIMITS.medium;
      var field = o.multiline
        ? '<textarea id="ask-text" rows="3" maxlength="' + max + '" placeholder="' + esc(o.placeholder || '') + '">' + esc(o.value || '') + '</textarea>'
        : '<input type="text" id="ask-text" maxlength="' + max + '" placeholder="' + esc(o.placeholder || '') + '" value="' + esc(o.value || '') + '">';
      var h = openModal({
        title: esc(title), sub: o.sub || '', cls: 'narrow ask-modal',
        body: '<div class="row"><label for="ask-text">' + esc(o.label || 'Motivo') + '</label>' + field + '<div class="field-err" id="ask-err" role="alert"></div></div>',
        footer: '<button type="button" class="ghost" data-act="no">Cancelar</button><button type="button" class="' + (o.danger ? 'danger-solid' : 'primary') + '" data-act="yes">' + esc(o.ok || 'Confirmar') + '</button>',
        onClose: function () { if (!done) resolve(null); },
      });
      function ok() {
        var v = h.$('#ask-text').value.trim();
        if (o.min && v.length < o.min) {
          h.$('#ask-err').textContent = o.minMsg || ('Escreva ao menos ' + o.min + ' caracteres.');
          h.$('#ask-text').focus();
          return;
        }
        done = true;
        h.close();
        resolve(v);
      }
      h.$('[data-act=no]').addEventListener('click', function () { h.close(); });
      h.$('[data-act=yes]').addEventListener('click', ok);
      h.$('#ask-text').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (!o.multiline || e.ctrlKey || e.metaKey)) { e.preventDefault(); ok(); } });
    });
  }
  function infoModal(title, html) {
    var h = openModal({ title: esc(title), body: html, cls: 'narrow', footer: '<button type="button" class="primary" data-act="ok" data-autofocus>Entendi</button>' });
    h.$('[data-act=ok]').addEventListener('click', function () { h.close(); });
    return h;
  }
  /**
   * Formulário em modal. o: {title, sub, body, ok, danger, wide, cls, id, onOk(h) → Promise|undefined, dirtyCheck: true}.
   * Com dirtyCheck, fechar com campos alterados pede confirmação.
   */
  function formModal(o) {
    var snap = null;
    var h = openModal({
      title: o.title, sub: o.sub, body: o.body, wide: o.wide, cls: o.cls, id: o.id,
      footer: (o.footerLeft || '') + '<button type="button" class="ghost" data-act="cancel">Cancelar</button>' +
        '<button type="button" class="' + (o.danger ? 'danger-solid' : 'primary') + '" data-act="ok">' + esc(o.ok || 'Salvar') + '</button>',
      isDirty: function () { return o.dirtyCheck !== false && snap !== null && formSnapshot(h.el) !== snap; },
    });
    snap = formSnapshot(h.el);
    h.markClean = function () { snap = formSnapshot(h.el); };
    h.$('[data-act=cancel]').addEventListener('click', function () { h.requestClose(); });
    function submit() {
      var p = o.onOk(h);
      if (p && p.then) {
        h.busy(true);
        p.then(function () { if (!h.closed) h.busy(false); }, function (e) { if (!h.closed) h.busy(false); fail(e); });
      }
    }
    h.$('[data-act=ok]').addEventListener('click', submit);
    h.el.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); } });
    return h;
  }
  function formSnapshot(root) {
    return qsa('input, select, textarea', root).map(function (el) { return el.type === 'checkbox' || el.type === 'radio' ? (el.checked ? '1' : '0') : el.value; }).join('\u0001');
  }
  function fv(h, id) { var el = h.$('#' + id); return el ? String(el.value || '').trim() : ''; }
  function invalid(h, id, msg) {
    var el = h.$('#' + id);
    if (el) { el.classList.add('invalid'); el.focus(); el.addEventListener('input', function () { el.classList.remove('invalid'); }, { once: true }); }
    toast(msg, true);
    return Promise.resolve();
  }
  function fieldHtml(id, label, control, help) {
    return '<div class="row"><label for="' + id + '">' + label + '</label>' + control + (help ? '<div class="help">' + help + '</div>' : '') + '</div>';
  }
  function inputHtml(id, value, o) {
    o = o || {};
    return '<input type="' + (o.type || 'text') + '" id="' + id + '" value="' + esc(value || '') + '"' + (o.max ? ' maxlength="' + o.max + '"' : '') +
      (o.placeholder ? ' placeholder="' + esc(o.placeholder) + '"' : '') + (o.list ? ' list="' + o.list + '"' : '') + (o.disabled ? ' disabled' : '') + '>';
  }
  function textareaHtml(id, value, o) {
    o = o || {};
    return '<textarea id="' + id + '" rows="' + (o.rows || 3) + '"' + (o.max ? ' maxlength="' + o.max + '"' : '') + (o.placeholder ? ' placeholder="' + esc(o.placeholder) + '"' : '') +
      (o.disabled ? ' disabled' : '') + '>' + esc(value || '') + '</textarea>';
  }
  function selectHtml(id, options, value, o) {
    o = o || {};
    return '<select id="' + id + '"' + (o.disabled ? ' disabled' : '') + '>' + options.map(function (op) {
      return '<option value="' + esc(op[0]) + '"' + (String(op[0]) === String(value == null ? '' : value) ? ' selected' : '') + '>' + esc(op[1]) + '</option>';
    }).join('') + '</select>';
  }

  // ============================================================ navegação e topo
  function show(view) {
    state.view = view;
    ['boot', 'povs', 'nolib', 'pov', 'admin'].forEach(function (v) { $('view-' + v).classList.toggle('hidden', v !== view); });
    renderCrumbs();
    window.scrollTo(0, 0);
  }
  function renderCrumbs() {
    var c = $('crumbs');
    if (state.view === 'pov' && state.pov) {
      c.innerHTML = '<a href="#" data-nav="home">PoVs</a> <span class="sep">›</span> <b>' + esc(state.pov.pov.cliente) + ' — ' + esc(state.pov.pov.titulo) + '</b>';
    } else if (state.view === 'admin') {
      c.innerHTML = '<a href="#" data-nav="home">PoVs</a> <span class="sep">›</span> <b>Administração</b>';
    } else {
      c.innerHTML = '<b>PoVs</b>';
    }
  }
  $('crumbs').addEventListener('click', function (e) {
    var a = e.target.closest('[data-nav]');
    if (!a) return;
    e.preventDefault();
    goHome();
  });
  $('brand-home').addEventListener('click', function (e) { e.preventDefault(); goHome(); });
  $('btn-admin').addEventListener('click', function () { openAdmin(); });
  $('btn-back-app').addEventListener('click', function () { goHome(); });
  $('btn-client-mode').addEventListener('click', function () {
    state.clientMode = !state.clientMode;
    lsSet(LS_CLIENT, state.clientMode ? '1' : '0');
    applyClientMode();
    rerenderCurrent();
    toast(state.clientMode ? 'Modo cliente ligado: campos internos ocultos.' : 'Modo cliente desligado.');
  });
  function applyClientMode() {
    var on = state.clientMode;
    var b = $('btn-client-mode');
    b.classList.toggle('on', on);
    b.setAttribute('aria-checked', on ? 'true' : 'false');
    $('client-banner').classList.toggle('hidden', !on);
    document.body.classList.toggle('client-mode', on);
  }
  function rerenderCurrent() {
    if (state.view === 'povs') renderPovs();
    else if (state.view === 'pov' && state.pov) {
      if (state.clientMode && state.tab === 'historico') state.tab = 'exec';
      if (state.clientMode) state.rep.publico = 'cliente';
      renderPovPage(true);
    }
  }

  // ============================================================ boot
  function boot() {
    applyClientMode();
    api('apiBootstrap').then(function (b) {
      state.user = b.user;
      state.admin = !!b.admin;
      state.visibilidade = b.visibilidade;
      state.libraryLoaded = !!b.library_loaded;
      state.importIncompleto = !!b.import_incompleto;
      state.appVersion = b.app_version;
      $('user-email').textContent = b.user;
      setCatalog(b.catalog);
      state.allPovs = b.povs || [];
      state.povs = state.allPovs;
      fillPovStatusSelect();
      if (!b.library_loaded) {
        if (b.admin) { openAdmin(); toast('A biblioteca de test cases ainda não foi importada. Importe o JSON do coletor ou carregue a demonstração.'); }
        else show('nolib');
        return;
      }
      renderPovs();
      show('povs');
    }).catch(function (e) {
      $('view-boot').innerHTML = '<div class="empty big"><h2>Não foi possível abrir o PoV Runner</h2><p>' + esc(e.message) + '</p></div>';
      show('boot');
    });
  }
  /** Recarrega bootstrap (catálogo e lista) — depois de importar a biblioteca. */
  function reloadBootstrap() {
    return api('apiBootstrap').then(function (b) {
      state.libraryLoaded = !!b.library_loaded;
      state.importIncompleto = !!b.import_incompleto;
      setCatalog(b.catalog);
      state.allPovs = b.povs || [];
      state.povs = state.allPovs;
      state.plan.sel = {};
      state.plan.checked = {};
    });
  }

  // ============================================================ PoVs (início)
  function fillPovStatusSelect() {
    var sel = $('pov-status');
    sel.innerHTML = '<option value="">Todos os status</option>' + ['planning', 'running', 'done', 'cancelled'].map(function (s) { return '<option value="' + s + '">' + esc(povStatusLabel(s)) + '</option>'; }).join('');
    sel.value = state.povFilter.status;
  }
  function goHome() {
    if (!state.libraryLoaded) {
      if (state.admin) { openAdmin(); toast('Importe a biblioteca primeiro.', true); } else show('nolib');
      return;
    }
    api('apiListPovs', {}).then(function (list) {
      state.allPovs = list;
      return loadPovList();
    }).then(function () { renderPovs(); show('povs'); }).catch(fail);
  }
  function povFilterActive() { var f = state.povFilter; return !!(f.q || f.status || f.mine); }
  function loadPovList() {
    if (!povFilterActive()) { state.povs = state.allPovs; return Promise.resolve(); }
    return api('apiListPovs', { q: state.povFilter.q, status: state.povFilter.status, mine: state.povFilter.mine }).then(function (list) { state.povs = list; });
  }
  var reloadPovList = debounce(function () { loadPovList().then(renderPovList).catch(fail); }, 250);
  $('pov-q').addEventListener('input', function (e) { state.povFilter.q = e.target.value; reloadPovList(); });
  $('pov-status').addEventListener('change', function (e) { state.povFilter.status = e.target.value; loadPovList().then(renderPovList).catch(fail); });
  $('pov-mine').addEventListener('change', function (e) { state.povFilter.mine = e.target.checked; loadPovList().then(renderPovList).catch(fail); });
  $('btn-new-pov').addEventListener('click', function () { openPovForm(null); });

  function renderPovs() {
    var banners = '';
    var meta = state.catalog ? state.catalog.meta : null;
    if (meta && meta.is_demo) banners += '<div class="banner info">Biblioteca de <b>demonstração</b>: casos sintéticos, só para experimentar o app. Um administrador pode importar a biblioteca real em Administração.</div>';
    if (state.importIncompleto || (meta && meta.import_incompleto)) banners += '<div class="banner">A última importação da biblioteca não terminou. Um administrador precisa refazê-la em Administração; até lá, textos e contadores podem estar incompletos.</div>';
    $('povs-banners').innerHTML = banners;
    var all = state.allPovs;
    function count(fn) { return all.filter(fn).length; }
    var counters = [
      ['info', count(function (p) { return p.status === 'planning'; }), 'Planejamento'],
      ['info', count(function (p) { return p.status === 'running'; }), 'Em execução'],
      ['ok', count(function (p) { return p.status === 'done'; }), 'Concluídas'],
    ];
    if (!state.clientMode) counters.push(['ok', count(function (p) { return p.desfecho === 'tech_win'; }), 'Vitórias técnicas']);

  // ============================================================ página da PoV
  function openPov(povId) {
    return api('apiGetPov', povId).then(function (view) { enterPov(view); }).catch(fail);
  }
  function enterPov(view, tab) {
    var changed = state.povId !== view.pov.pov_id;
    if (changed) {
      state.exec = { status: '', mine: false, today: false, q: '', selected: {} };
      state.plan.sel = {};
      state.plan.checked = {};
      state.rep = { tipo: 'resultados', publico: state.clientMode ? 'cliente' : 'interno', detalhe: null, preview: null, key: '', seq: state.rep.seq + 1, lastSave: null };
    }
    state.pov = view;
    state.povId = view.pov.pov_id;
    derive();
    state.tab = tab || state.tabByPov[state.povId] || 'exec';
    if (state.clientMode && state.tab === 'historico') state.tab = 'exec';
    $('exec-q').value = state.exec.q;
    $('exec-mine').checked = state.exec.mine;
    $('exec-today').checked = state.exec.today;
    show('pov');
    renderPovPage(true);
  }
  /** Novo view do servidor: atualiza cabeçalho e a aba atual. */
  function setView(view) {
    if (!view || !view.pov) return;
    if (view.pov.pov_id !== state.povId) { enterPov(view); return; }
    state.pov = view;
    derive();
    // descarta seleção de casos que saíram do plano
    Object.keys(state.exec.selected).forEach(function (id) { if (!state.d.items[id]) delete state.exec.selected[id]; });
    renderCrumbs();
    renderPovPage(false);
  }
  /** Conflito de concorrência numa gravação (PoV, critério, pendência): recarrega a PoV em segundo plano e repassa o erro. */
  function conflictRefresh(e) {
    if (e && /alterad[oa] por/.test(e.message) && state.povId) {
      api('apiGetPov', state.povId).then(setView).catch(function () { /* o toast do erro original já orienta */ });
      e = new Error(e.message + ' A tela foi atualizada com a versão atual; confira e salve de novo.');
    }
    throw e;
  }
  function derive() {
    var v = state.pov;
    var d = { items: {}, n: {}, crit: {}, critN: {} };
    var n = 0;
    v.groups.forEach(function (g) { g.items.forEach(function (it) { d.items[it.exec_id] = it; d.n[it.exec_id] = ++n; }); });
    v.criterios.list.forEach(function (c) { d.crit[c.crit_id] = c; d.critN[c.crit_id] = 'C' + c.n; });
    state.d = d;
  }

  function runBulk(changes) {
    var ids = selectedIds();
    if (!ids.length) return Promise.resolve();
    if (ids.length > LIMITS.planBatch) { toast('No máximo ' + LIMITS.planBatch + ' casos por ação em lote.', true); return Promise.resolve(); }
    var expected = {};
    ids.forEach(function (id) { expected[id] = state.d.items[id].atualizado_em; });
    return api('apiBulkUpdate', state.povId, ids, changes, expected).then(function (res) {
      setView(res.view);
      var r = res.result;
      if (r.conflicts && r.conflicts.length) showBulkConflicts(r.conflicts, r.updated);

  function checklistHtml(ctx, f) {

  $('pend-body').addEventListener('click', function (e) {

            .then(function (view) { setView(view); toast('Pendência resolvida.' + (p.exec_ids.length ? ' Lembre de atualizar o status dos casos bloqueados.' : '')); });

  // ============================================================ aba Relatório
  function repDetalhe() {
    var R = state.rep;
    if (R.tipo === 'status') return false;
    if (R.detalhe !== null) return R.detalhe;
    return !(R.tipo === 'plano' && R.publico === 'cliente');
  }
  function repOpts() {
    var R = state.rep;
    var o = { tipo: R.tipo, publico: state.clientMode ? 'cliente' : R.publico };
    if (R.tipo !== 'status') o.detalhe = repDetalhe();
    return o;
  }
  function renderRep(tabChanged) {
    var R = state.rep, cm = state.clientMode;
    if (cm) R.publico = 'cliente';
    qsa('#rep-tipo button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === R.tipo); });
    qsa('#rep-publico button').forEach(function (b) {
      var v = b.getAttribute('data-v');
      b.classList.toggle('on', v === R.publico);
      b.disabled = cm && v === 'interno';
      b.title = cm && v === 'interno' ? 'Desligue o modo cliente para gerar a versão interna' : '';
    });
    var det = $('rep-detalhe');
    det.checked = repDetalhe();
    det.disabled = R.tipo === 'status';
    $('rep-publico-hint').textContent = R.publico === 'cliente'
      ? 'Versão do cliente: sem laboratório, posicionamento, notas, observações internas e links internos; passa pela verificação de vazamento.'
      : 'Versão interna: inclui laboratório, posicionamento oficial, observações internas e links do POV Companion. Não envie ao cliente.';
    renderRepResult();
    renderRepHistory();
    var key = JSON.stringify(repOpts()) + '|' + state.povId;
    if (tabChanged || !R.preview || R.key !== key) loadPreview();
    else renderLeaks();
  }
  function loadPreview() {
    var R = state.rep, seq = ++R.seq, opts = repOpts(), key = JSON.stringify(opts) + '|' + state.povId;
    R.key = key;
    return api('apiPreviewReport', state.povId, opts).then(function (r) {
      if (seq !== R.seq) return;
      R.preview = r;
      $('preview').srcdoc = r.html;
      renderLeaks();
    }).catch(fail);
  }
  function renderLeaks() {
    var R = state.rep, el = $('rep-leaks');
    if (R.publico !== 'cliente' || !R.preview || R.preview.publico !== 'cliente') { el.innerHTML = ''; return; }
    var vz = R.preview.vazamentos || [];
    el.innerHTML = vz.length
      ? '<div class="leak-panel" id="leak-panel"><div class="lp-head"><b>Verificação de vazamento: ' + plural(vz.length, 'ponto para revisar', 'pontos para revisar') + '</b> antes de enviar ao cliente.</div>' +
        leakTable(vz) +
        '<p class="small muted nomargin">Procura nomes de concorrentes (da biblioteca e das Configurações), e-mails, links e palavras como "interno" nos textos livres. Links internos citados nos textos da biblioteca já saem como "' + esc(REDACTED) + '". ' +
        'Corrija o texto na execução/critérios ou confirme ao salvar.</p></div>'
      : '<div class="leak-ok" id="leak-panel">Verificação de vazamento: nada encontrado nesta versão do cliente.</div>';
  }
  function leakTable(vz) {

      return '<tr><td>' + esc(x.onde) + '</td><td>' + esc(LEAK_TIPO[x.tipo] || x.tipo) + '</td><td class="mono">' + esc(x.trecho) + '</td></tr>';

  function renderRepResult() {

  function renderRepHistory() {

    $('rep-history').innerHTML = list.length ? '<table class="hist"><thead><tr><th>Data</th><th>Documento</th><th>Audiência</th><th>Casos</th><th>Autor</th><th>Arquivos</th></tr></thead><tbody>' +

  /** Id do arquivo numa URL do Drive (…/d/<id>/…) — o registro do documento guarda só a URL. */
  function driveFileId(url) { var m = String(url || '').match(/\/d\/([-\w]{25,})/); return m ? m[1] : ''; }
  function downloadPdf(pdfId) {
    return api('apiPdfBase64', state.povId, pdfId).then(function (r) {
      var bin = atob(r.base64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      downloadBlob(r.name, new Blob([bytes], { type: 'application/pdf' }));
    }).catch(fail);
  }
  $('rep-history').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-pdf]');
    if (b) downloadPdf(b.getAttribute('data-pdf'));
  });
  $('rep-tipo').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-v]');
    if (!b) return;
    state.rep.tipo = b.getAttribute('data-v');
    renderRep(false);
  });
  $('rep-publico').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-v]');
    if (!b || b.disabled) return;
    state.rep.publico = b.getAttribute('data-v');
    renderRep(false);
  });
  $('rep-detalhe').addEventListener('change', function (e) { state.rep.detalhe = e.target.checked; renderRep(false); });
  $('btn-rep-preview').addEventListener('click', function () { loadPreview(); });
  $('btn-rep-open').addEventListener('click', function () {
    var R = state.rep;
    if (!R.preview) { toast('Aguarde a pré-visualização.', true); return; }
    var w = window.open('', '_blank');
    if (!w) { toast('O navegador bloqueou a nova aba. Permita pop-ups para este site.', true); return; }
    w.document.open();
    w.document.write(R.preview.html);
    w.document.close();
  });
  $('btn-rep-save').addEventListener('click', function () { saveReport(false); });
  function saveReport(confirmed) {
    var btn = $('btn-rep-save');
    var opts = repOpts();
    if (confirmed) opts.confirmarVazamentos = true;
    btn.disabled = true;
    return api('apiSaveReport', state.povId, opts).then(function (r) {
      if (r.needs_confirmation) {
        return askConfirm('Salvar a versão do cliente mesmo assim?',
          '<p>A verificação encontrou ' + plural(r.vazamentos.length, 'ponto', 'pontos') + ' que talvez não devam ir para o cliente:</p>' + leakTable(r.vazamentos) +
          '<p class="small muted">Ao salvar, o documento fica no Drive com esses trechos. Você pode cancelar, corrigir e gerar de novo.</p>',
          { ok: 'Salvar mesmo assim', cancel: 'Cancelar', id: 'leak-confirm', cls: 'medium' })
          .then(function (ok) { btn.disabled = false; if (ok) return saveReport(true); });
      }
      state.rep.lastSave = Object.assign({ pov: state.povId }, r);
      renderRepResult();
      toast(r.pdf_error ? r.pdf_error : 'Documento salvo no Drive.', !!r.pdf_error);
      return api('apiGetPov', state.povId).then(setView);
    }).catch(fail).then(function () { btn.disabled = false; });
  }
  function downloadBlob(name, blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.parentNode && a.parentNode.removeChild(a); }, 2000);
  }
  $('btn-rep-pdf').addEventListener('click', function () {
    var s = state.rep.lastSave;
    if (!s || !s.pdf_id) return;
    downloadPdf(s.pdf_id);
  });
  $('btn-rep-csv').addEventListener('click', function () {
    api('apiExportCsv', state.povId, { publico: state.clientMode ? 'cliente' : state.rep.publico }).then(function (r) {
      downloadBlob(r.name, new Blob([r.csv], { type: 'text/csv;charset=utf-8' }));
      toast('CSV (' + (PUBLICO[state.clientMode ? 'cliente' : state.rep.publico]) + ') baixado.');
    }).catch(fail);
  });

  // ============================================================ aba Histórico
  function renderHist() {
    var list = state.pov.historico || [];
    $('hist-list').innerHTML = list.length ? '<table class="hist"><thead><tr><th>Data</th><th>Tipo</th><th>Caso</th><th>De → para</th><th>Nota</th><th>Autor</th></tr></thead><tbody>' +
      list.map(function (h) {
        var dp = h.de || h.para ? (h.de ? esc(h.de) + ' → ' : '') + '<b>' + esc(h.para) + '</b>' : '';
        return '<tr><td class="num">' + esc(dt(h.em)) + '</td><td><span class="badge">' + esc(HIST_TIPO[h.tipo] || h.tipo) + '</span></td><td>' + esc(h.caso || '') + '</td><td>' + dp + '</td>' +
          '<td class="small pre">' + esc(h.nota || '') + '</td><td class="small">' + esc(h.autor) + '</td></tr>';
      }).join('') + '</tbody></table>' + (list.length >= 300 ? '<p class="faint small">Mostrando os 300 eventos mais recentes.</p>' : '') : '<div class="empty">Sem eventos.</div>';
  }

  // ============================================================ Administração
  function openAdmin() {
    show('admin');
    $('admin-body').innerHTML = '<div class="empty">Carregando…</div>';
    api('apiAdminInfo').then(function (info) { state.adminInfo = info; renderAdmin(); }).catch(function (e) { fail(e); $('admin-body').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }
  function renderAdmin() {
    var info = state.adminInfo, admin = !!info.admin, I = state.imp;
    var h = '<div class="grid-2">';
    if (admin) {
      h += '<div class="card" id="import-card"><h2>Importar biblioteca</h2>' +
        fieldHtml('import-file', 'Id ou URL do arquivo no Drive', inputHtml('import-file', I.name ? '' : I.ref, { placeholder: 'https://drive.google.com/file/d/…/view' })) +
        '<div class="or">ou</div>' +
        '<div class="row"><label for="import-local">Arquivo do computador (vai para o Drive, em PoV Runner/importacoes; até 40 MB)</label><input type="file" id="import-local" accept=".json,application/json"></div>' +
        (I.name ? '<div class="small muted">Arquivo enviado: <b>' + esc(I.name) + '</b></div>' : '') +
        '<div class="toolbar"><button type="button" id="btn-dryrun">Analisar (dry-run)</button><button type="button" id="btn-import" class="primary"' + (I.dry ? '' : ' disabled') + '>Confirmar importação</button></div>' +
        '<div id="dryrun" class="dry">' + dryHtml() + '</div></div>';
    }
    h += '<div class="card"><h2>Estado</h2><div id="admin-info" class="kv">' + adminInfoHtml(info) + '</div>';
    if (admin) {
      h += '<h2 class="mt">Biblioteca de demonstração</h2><p class="muted small">Casos sintéticos, com o mesmo formato do coletor, para experimentar o app. Só pode ser carregada com a biblioteca vazia (ou já em modo demonstração).</p>' +
        '<div class="toolbar tight"><button type="button" id="btn-demo"' + (info.library_total !== '0' && !info.library_is_demo ? ' disabled title="A biblioteca real já foi importada"' : '') + '>Carregar demonstração</button></div>';
    } else {
      h += '<p class="muted small mt">Somente administradores importam a biblioteca e mudam as configurações. Fale com quem publicou o app.</p>';
    }
    h += '</div></div>';
    if (admin && info.settings) h += settingsHtml(info.settings);
    $('admin-body').innerHTML = h;
  }
  function adminInfoHtml(info) {
    var rows = [
      ['Último import', info.last_import_at ? esc(dt(info.last_import_at)) + (info.last_import_by ? ' por ' + esc(info.last_import_by) : '') + (info.last_import_obs ? ' <span class="badge warn">' + esc(info.last_import_obs) + '</span>' : '') : 'nunca'],
      ['Export da biblioteca', info.library_export_date ? esc(dt(info.library_export_date)) : '—'],
      ['Tradução pt-BR', info.translation_date ? esc(dt(info.translation_date)) : 'sem tradução'],
      ['Test cases', esc(info.library_total) + (info.library_is_demo ? ' <span class="badge">demonstração</span>' : '')],
      ['Importação', info.import_incompleto ? '<span class="badge bad">incompleta — refaça a importação</span>' : 'ok'],
      ['Versão do app', esc(info.app_version)],
      ['Pasta no Drive', info.drive_folder_id ? link('https://drive.google.com/drive/folders/' + encodeURIComponent(info.drive_folder_id), 'abrir ↗') : 'criada no primeiro documento salvo'],
      ['Você', esc(state.user) + (info.admin ? ' <span class="badge ok">administrador</span>' : '')],
    ];
    return rows.map(function (r) { return '<div class="k">' + r[0] + '</div><div>' + r[1] + '</div>'; }).join('');
  }
  function shortList(arr, max) {
    arr = arr || [];
    max = max || 12;
    if (!arr.length) return '';
    return '<div class="list">' + arr.slice(0, max).map(esc).join(' · ') + (arr.length > max ? ' · … e mais ' + (arr.length - max) : '') + '</div>';
  }
  function dryHtml() {
    var I = state.imp, d = I.dry;
    var h = '';
    if (I.error) {
      h += '<div class="notice bad">' + esc(I.error) + '</div>';
      if (/parcial/i.test(I.error)) h += '<label class="check"><input type="checkbox" id="imp-partial"' + (I.allowPartial ? ' checked' : '') + '> Importar mesmo assim (export parcial)</label><div class="help">Marque e rode o dry-run de novo. Casos ausentes no arquivo não viram órfãos.</div>';
    }
    if (!d) return h;
    function line(label, value, list, cls) { return '<div class="line' + (cls ? ' ' + cls : '') + '"><span>' + label + '</span><span class="v">' + value + '</span></div>' + (list || ''); }
    var ref = d.referencias_detalhe || {};
    var refTxt = Object.keys(ref).filter(function (k) { return ref[k]; }).map(function (k) { return k + ': ' + ref[k]; }).join(' · ');
    h += '<div class="dry-head">Resultado do dry-run' + (d.is_demo ? ' <span class="badge">demonstração</span>' : '') + (d.parcial ? ' <span class="badge warn">export parcial</span>' : '') + '</div>' +
      line('Export da biblioteca', esc(d.library_export_date ? dt(d.library_export_date) : '—')) +
      line('Casos no arquivo / atuais', d.total_novo + ' / ' + d.total_atual) +
      line('Novos', d.novos.length, shortList(d.novos)) +
      line('Alterados', d.alterados.length, shortList(d.alterados)) +
      line('Removidos', d.removidos.length, shortList(d.removidos), d.removidos.length ? 'warn' : '') +
      line('Excluídos (não publicados ou privados)', d.excluidos.length, shortList(d.excluidos)) +
      line('Execuções que ficarão órfãs', d.execucoes_orfas.length + (d.execucoes_orfas_em_pov_ativa ? ' <span class="badge bad">' + d.execucoes_orfas_em_pov_ativa + ' em PoVs em execução/concluídas</span>' : ''), shortList(d.execucoes_orfas), d.execucoes_orfas.length ? 'warn' : '') +
      line('Execuções reabilitadas', d.execucoes_reabilitadas) +
      line('Execuções com caso alterado', d.execucoes_caso_alterado.length, shortList(d.execucoes_caso_alterado)) +
      line('Execuções com ciclo de vida alterado', d.execucoes_ciclo_alterado.length, shortList(d.execucoes_ciclo_alterado)) +
      line('Referências não resolvidas', d.referencias_nao_resolvidas, refTxt ? '<div class="list">' + esc(refTxt) + '</div>' : '') +
      line('Casos com tradução pendente', d.traducao_pendente) +
      line('Traduções preservadas / perdidas', d.traducoes_preservadas + ' / ' + d.traducoes_perdidas) +
      line('Export parcial', d.parcial ? 'sim' : 'não');
    if (d.avisos && d.avisos.length) h += '<div class="notice warn"><b>Avisos</b><ul>' + d.avisos.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></div>';
    if (d.parcial) h += '<label class="check"><input type="checkbox" id="imp-partial"' + (I.allowPartial ? ' checked' : '') + '> Importar mesmo assim (export parcial)</label>';
    if (d.execucoes_orfas_em_pov_ativa > 0) h += '<label class="check"><input type="checkbox" id="imp-orphans"' + (I.confirmOrphans ? ' checked' : '') + '> Confirmo as execuções órfãs (' + d.execucoes_orfas_em_pov_ativa + ' em PoVs em execução ou concluídas)</label>';
    return h;
  }
  function settingsHtml(s) {
    return '<div class="card mt" id="settings-card"><h2>Configurações</h2><div class="grid-2 tight">' +
      '<div>' + fieldHtml('set-usuarios', 'Usuários autorizados', textareaHtml('set-usuarios', s.usuarios, { rows: 3, max: 5000, placeholder: '@empresa.com, pessoa@parceiro.com' }),
        'E-mails e/ou domínios (@empresa.com), separados por vírgula ou linha. Vazio = qualquer pessoa com acesso ao web app (o domínio).') +
      fieldHtml('set-admins', 'Administradores', textareaHtml('set-admins', s.admins, { rows: 2, max: 5000, placeholder: 'e-mails' }), 'Quem publicou o app é sempre administrador.') + '</div>' +
      '<div>' + fieldHtml('set-vis', 'Visibilidade das PoVs', selectHtml('set-vis', [['equipe', 'Equipe da PoV'], ['todos', 'Todos os usuários autorizados']], s.visibilidade),
        '<b>Equipe</b>: cada PoV aparece só para quem a criou, o responsável, os e-mails do campo Equipe e os administradores. <b>Todos</b>: qualquer usuário autorizado vê e edita todas as PoVs.') +
      fieldHtml('set-pasta', 'Pasta do Drive', inputHtml('set-pasta', s.drive_folder_id, { placeholder: 'id ou URL da pasta' }),
        'Onde ficam documentos e evidências. Recomendado: uma pasta num <b>Drive compartilhado</b> da equipe, para os arquivos não dependerem de uma conta pessoal. A conta que publicou o app precisa ter acesso.') +
      fieldHtml('set-conc', 'Concorrentes extras (verificação de vazamento)', textareaHtml('set-conc', s.concorrentes_extra, { rows: 2, max: 2000, placeholder: 'nomes separados por vírgula ou linha' }),
        'Além dos concorrentes da biblioteca, nomes que não podem aparecer nos documentos do cliente.') + '</div></div>' +
      '<div class="toolbar"><button type="button" id="btn-settings-save" class="primary">Salvar configurações</button></div></div>';
  }
  function importRef() { var el = $('import-file'); var v = el ? el.value.trim() : ''; return v || state.imp.ref; }
  function runDryRun() {
    var I = state.imp;
    var ref = importRef();
    if (!ref) { toast('Informe o id/URL do arquivo no Drive ou escolha um arquivo do computador.', true); return Promise.resolve(); }
    I.ref = ref;
    I.dry = null;
    I.error = '';
    return api('apiImportDryRun', ref, { allowPartial: I.allowPartial }).then(function (d) {
      I.dry = d;
      renderAdmin();
    }).catch(function (e) { I.error = e.message; renderAdmin(); fail(e); });
  }
  $('admin-body').addEventListener('click', function (e) {
    var id = e.target.id;
    if (id === 'btn-dryrun') { state.imp.name = ''; state.imp.confirmOrphans = false; runDryRun(); }
    else if (id === 'btn-import') confirmImport();
    else if (id === 'btn-demo') {
      askConfirm('Carregar a biblioteca de demonstração?', 'Os casos sintéticos substituem a biblioteca de demonstração atual (se houver). PoVs e execuções são preservadas.', { ok: 'Carregar' })
        .then(function (ok) {
          if (!ok) return;
          return api('apiLoadDemo').then(function (d) {
            toast('Biblioteca de demonstração carregada: ' + d.total_novo + ' casos sintéticos.');
            return reloadBootstrap().then(function () { return api('apiAdminInfo'); }).then(function (info) { state.adminInfo = info; renderAdmin(); });
          });
        }).catch(fail);
    } else if (id === 'btn-settings-save') saveSettings();
  });
  $('admin-body').addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'imp-partial') { state.imp.allowPartial = t.checked; if (state.imp.error) runDryRun(); }
    else if (t.id === 'imp-orphans') state.imp.confirmOrphans = t.checked;
    else if (t.id === 'import-local' && t.files && t.files[0]) uploadLocal(t.files[0]);
  });
  function uploadLocal(file) {
    if (file.size > 40 * 1024 * 1024) { toast('Arquivo maior que 40 MB. Suba no Drive e informe o link.', true); return; }
    var reader = new FileReader();
    reader.onload = function () {
      api('apiUploadBundle', file.name, String(reader.result || '')).then(function (r) {
        state.imp.ref = r.file_id;
        state.imp.name = r.name;
        state.imp.dry = null;
        state.imp.error = '';
        renderAdmin();
        toast('Arquivo guardado no Drive. Analisando…');
        return runDryRunRef(r.file_id);
      }).catch(fail);
    };
    reader.onerror = function () { toast('Não consegui ler o arquivo.', true); };
    reader.readAsText(file, 'UTF-8');
  }
  function runDryRunRef(ref) {
    var I = state.imp;
    return api('apiImportDryRun', ref, { allowPartial: I.allowPartial }).then(function (d) { I.dry = d; I.error = ''; renderAdmin(); })
      .catch(function (e) { I.error = e.message; renderAdmin(); fail(e); });
  }
  function confirmImport() {
    var I = state.imp, d = I.dry;
    if (!d) return;
    if (d.parcial && !I.allowPartial) { toast('O arquivo é um export parcial: marque "Importar mesmo assim" para seguir.', true); return; }
    if (d.execucoes_orfas_em_pov_ativa > 0 && !I.confirmOrphans) { toast('Confirme as execuções órfãs antes de importar.', true); return; }
    askConfirm('Confirmar a importação?', '<p>Library, Taxonomia e Ambientes serão reescritas com ' + d.total_novo + ' casos (' + d.novos.length + ' novos, ' + d.alterados.length + ' alterados, ' + d.removidos.length + ' removidos). ' +
      'PoVs, execuções, critérios, pendências, histórico e documentos são preservados.</p>', { ok: 'Importar' })
      .then(function (ok) {
        if (!ok) return;
        $('btn-import').disabled = true;
        return api('apiImportConfirm', I.ref, { allowPartial: I.allowPartial, confirmOrphans: I.confirmOrphans }).then(function (r) {
          toast('Importado: ' + r.total_novo + ' casos (' + r.novos.length + ' novos, ' + r.alterados.length + ' alterados, ' + r.removidos.length + ' removidos).');
          state.imp = { ref: '', name: '', dry: null, error: '', allowPartial: false, confirmOrphans: false };
          return reloadBootstrap().then(function () { return api('apiAdminInfo'); }).then(function (info) { state.adminInfo = info; renderAdmin(); });
        });
      }).catch(function (e) { fail(e); var b = $('btn-import'); if (b) b.disabled = false; });
  }
  function saveSettings() {
    var s = { usuarios: $('set-usuarios').value.trim(), admins: $('set-admins').value.trim(), visibilidade: $('set-vis').value,
      drive_folder_id: $('set-pasta').value.trim(), concorrentes_extra: $('set-conc').value.trim() };
    var btn = $('btn-settings-save');
    btn.disabled = true;
    api('apiSaveSettings', s).then(function (info) {
      state.adminInfo = info;
      state.visibilidade = info.settings ? info.settings.visibilidade : state.visibilidade;
      renderAdmin();
      toast('Configurações salvas.');
    }).catch(function (e) { fail(e); btn.disabled = false; });
  }

  boot();
})();
</script>
